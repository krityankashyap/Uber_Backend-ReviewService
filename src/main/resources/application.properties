spring.application.name=UberReview

spring.datasource.url=jdbc:mysql://localhost:3306/Uber_db_local

spring.datasource.username=root

spring.datasource.password=aA@888888

spring.jpa.show-sql=true


# to enable lazy loading in springJPA
spring.jpa.properties.hibernate.enable_lazy_load_no_trans= true

# Change this from validate to none
spring.jpa.hibernate.ddl-auto=none

# This ensures Flyway runs before Hibernate tries to initialize
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
